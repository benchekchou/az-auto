<section class="login">
  <div class="login__card">
    <span class="eyebrow">Espace gestion</span>
    <h1>Connexion admin</h1>
    <p class="login__text">Réservé au garage — le catalogue reste visible par tous sans connexion.</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>Mot de passe</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          autofocus
          required
        />
      </label>

      @if (error()) {
        <p class="error-banner">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--gold login__submit" [disabled]="loading() || !password">
        {{ loading() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>
  </div>
</section>
