<header class="header">
  <div class="header__bar container">
    <a routerLink="/" class="header__brand" (click)="closeMenu()">
      <span class="header__mark">
        <img [src]="garage.logo" [alt]="garage.nom" />
      </span>
      <span class="header__brand-text">
        <span class="header__name">{{ garage.nom }}</span>
        <span class="header__place">{{ garage.ville }}</span>
      </span>
    </a>

    <nav class="header__nav" [class.header__nav--open]="isMenuOpen()">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Accueil</a>
      <a routerLink="/catalogue" routerLinkActive="is-active" (click)="closeMenu()">Catalogue</a>
      <a routerLink="/comparateur" routerLinkActive="is-active" (click)="closeMenu()">Comparateur</a>
      <a routerLink="/" fragment="contact" (click)="closeMenu()">Contact</a>
    </nav>

    <div class="header__actions">
      <a
        class="header__icon-link"
        routerLink="/catalogue"
        [queryParams]="{ favoris: 1 }"
        aria-label="Voir mes favoris"
        title="Favoris"
      >
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 20s-7-4.35-9.5-8.5C.7 8 2 4.5 5.5 4c2-.3 3.7.7 4.9 2.3C11.6 4.7 13.3 3.7 15.3 4c3.5.5 4.8 4 3 7.5C20.2 15.65 12 20 12 20z" />
        </svg>
        @if (favoritesCount() > 0) {
          <span class="header__badge">{{ favoritesCount() }}</span>
        }
      </a>

      <div class="header__admin">
        <button type="button" class="header__icon-btn" (click)="toggleAdmin()" aria-label="Gérer le catalogue" title="Gérer">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
            <path d="M19.4 13a7.4 7.4 0 0 0 .06-2l2.03-1.58-2-3.46-2.4.96a7.5 7.5 0 0 0-1.73-1L15 3h-4l-.36 2.5a7.5 7.5 0 0 0-1.73 1l-2.4-.96-2 3.46L6.54 10.5a7.4 7.4 0 0 0 0 2L4.5 15.08l2 3.46 2.4-.96c.52.43 1.1.78 1.73 1L11 22h4l.36-2.42c.63-.22 1.21-.57 1.73-1l2.4.96 2-3.46L19.4 13z" />
          </svg>
        </button>

        @if (isAdminOpen()) {
          <div class="header__dropdown">
            <button type="button" (click)="addCar()">+ Ajouter une voiture</button>
            <button type="button" (click)="exportJson()">Exporter le catalogue</button>
            <button type="button" (click)="triggerImport()">Importer un catalogue</button>
          </div>
        }
      </div>

      <button type="button" class="header__burger" (click)="toggleMenu()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (errorMessage()) {
    <p class="error-banner header__error">{{ errorMessage() }}</p>
  }

  <input
    #importInput
    type="file"
    accept="application/json"
    hidden
    (change)="onImportFileSelected($event)"
  />
</header>
