<article class="card" (click)="openDetail()">
  <div class="card__photo">
    <app-photo-carousel [photos]="car().photos" />
    <span class="badge card__status" [class]="statusClass()">{{ car().statut }}</span>

    <button
      type="button"
      class="card__fav"
      [class.card__fav--active]="isFavorite()"
      (click)="toggleFavorite($event)"
      aria-label="Ajouter aux favoris"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" [attr.fill]="isFavorite() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8">
        <path d="M12 20s-7-4.35-9.5-8.5C.7 8 2 4.5 5.5 4c2-.3 3.7.7 4.9 2.3C11.6 4.7 13.3 3.7 15.3 4c3.5.5 4.8 4 3 7.5C20.2 15.65 12 20 12 20z" />
      </svg>
    </button>
  </div>

  <div class="card__body">
    <h3 class="card__title">{{ car().marque }} {{ car().modele }}</h3>
    <p class="card__price">{{ car().prix | number: '1.0-0' : 'fr-FR' }} €</p>
    <p class="card__meta">
      {{ car().annee }} · {{ car().kilometrage | number: '1.0-0' : 'fr-FR' }} km · {{ car().carburant }}
    </p>

    <div class="card__footer">
      <label class="card__compare" (click)="stop($event)">
        <input
          type="checkbox"
          [checked]="isCompared()"
          [disabled]="compareDisabled()"
          (change)="toggleCompare($event)"
        />
        Comparer
      </label>

      <div class="card__contact">
        <a [href]="telLink" (click)="stop($event)" class="card__contact-btn" aria-label="Appeler" title="Appeler">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L7.9 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.3z" />
          </svg>
        </a>
        <a [href]="whatsappLink" target="_blank" rel="noopener" (click)="stop($event)" class="card__contact-btn card__contact-btn--whatsapp" aria-label="WhatsApp" title="WhatsApp">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-2-1.2-.7-.6-1.2-1.4-1.4-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5s-.6-1.5-.8-2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1z" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</article>
